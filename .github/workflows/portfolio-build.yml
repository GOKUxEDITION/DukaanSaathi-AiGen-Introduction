name: Personal Portfolio Build

on:
  push:
    branches: [main, personal-3d-portfolio]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build portfolio website
        run: npm run build
      - name: Upload website build
        uses: actions/upload-artifact@v4
        with:
          name: goku-choudhary-portfolio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
